[package]
name = "mdm-ipc"
description = "Command channel between MDM, its command line and the browser host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
craft-atomic.workspace = true
dirs.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Whether this program runs from a disk image (browsers.rs on_disk_image): its volume's
# read-only flag, safely (already in the tree, as the engine's free-space probe uses it).
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
