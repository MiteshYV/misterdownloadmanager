[package]
name = "mdm-scan"
description = "Checks a finished download's files before they leave quarantine: disguised programs, installers, locked archives, signatures, ClamAV"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# The same ZIP reader as extraction (mdm-extract), to look inside a ZIP without unpacking it.
zip = { version = "9.1.3", default-features = false, features = ["deflate", "deflate64", "aes-crypto"] }
mdm-extract.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
